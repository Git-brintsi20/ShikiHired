name: Auto Rebuild Portfolio Stats

# Trigger rebuilds every 12 hours to fetch fresh coding stats
on:
  schedule:
    # Run at 0:00 UTC and 12:00 UTC (every 12 hours)
    - cron: '0 0,12 * * *'

  # Also allow manual trigger
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: portfolio-layout-and-page

      - name: Build project
        run: npm run build
        working-directory: portfolio-layout-and-page

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: portfolio-layout-and-page
          production: true
